<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대사 연습</title>

<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: sans-serif;
}

.container {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

.topbar {
  padding: 10px;
  background: #222;
  display: flex;
  gap: 5px;
}

.script-area {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  font-size: 18px;
  line-height: 1.6;
}

.controls {
  padding: 10px;
  background: #222;
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

button {
  flex: 1;
  padding: 12px;
  font-size: 16px;
  border: none;
  background: #444;
  color: white;
  border-radius: 8px;
}

button:active {
  background: #666;
}

textarea {
  width: 100%;
  height: 150px;
  background: #000;
  color: white;
  border: none;
  padding: 10px;
}

/* 역할 색상 */
.mine {
  color: #00ff88;
}

.other {
  color: white;
}

.direction {
  color: yellow;
}

/* 모바일 최적화 */
@media (max-width:768px){

.script-area{
  font-size:20px;
}

button{
  font-size:18px;
  padding:14px;
}

textarea{
  height:120px;
}

}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
<button onclick="saveScript()">저장</button>
<button onclick="loadScript()">불러오기</button>
<button onclick="deleteScript()">삭제</button>
</div>

<textarea id="scriptInput" placeholder="대본 입력

혁: 안녕
안나: 반가워
[지문] 문을 열고 들어온다"></textarea>

<div id="scriptView" class="script-area"></div>

<div class="controls">
<button onclick="startPractice()">시작</button>
<button onclick="showMine()">내 대사보기</button>
</div>

</div>

<script>

let scripts = JSON.parse(localStorage.getItem("scripts") || "{}");
let mineVisible = false;

function parseScript(text){

  let lines = text.split("\n");
  let html = "";

  for(let line of lines){

    if(line.startsWith("[지문]")){
      html += `<div class="direction">${line}</div>`;
    }

    else if(line.startsWith("혁:")){
      let cls = mineVisible ? "mine" : "other";
      html += `<div class="${cls}">${line}</div>`;
    }

    else if(line.startsWith("안나:")){
      html += `<div class="other">${line}</div>`;
    }

    else{
      html += `<div>${line}</div>`;
    }
  }

  return html;
}

function startPractice(){

  let text = document.getElementById("scriptInput").value;
  document.getElementById("scriptView").innerHTML = parseScript(text);

  speakScript(text);
}

function showMine(){

  mineVisible = !mineVisible;

  let text = document.getElementById("scriptInput").value;
  document.getElementById("scriptView").innerHTML = parseScript(text);
}

function speakScript(text){

  let lines = text.split("\n");

  let index = 0;

  function next(){

    if(index >= lines.length) return;

    let line = lines[index];
    index++;

    let msg = new SpeechSynthesisUtterance();

    if(line.startsWith("혁:")){
      next();
      return;
    }

    if(line.startsWith("안나:")){
      msg.text = line.replace("안나:", "");
      msg.lang = "ko-KR";
    }

    else if(line.startsWith("[지문]")){
      msg.text = line.replace("[지문]", "");
      msg.lang = "ko-KR";
    }

    else{
      next();
      return;
    }

    msg.onend = next;
    speechSynthesis.speak(msg);
  }

  next();
}

function saveScript(){

  let name = prompt("저장 이름");
  if(!name) return;

  let pass = prompt("비밀번호 4자리");
  if(!pass) return;

  let text = document.getElementById("scriptInput").value;

  scripts[name] = {
    pass: pass,
    text: text
  };

  localStorage.setItem("scripts", JSON.stringify(scripts));

  alert("저장됨");
}

function loadScript(){

  let name = prompt("불러올 이름");
  if(!name) return;

  if(!scripts[name]){
    alert("없음");
    return;
  }

  let pass = prompt("비밀번호");

  if(scripts[name].pass != pass){
    alert("비번 틀림");
    return;
  }

  document.getElementById("scriptInput").value = scripts[name].text;
}

function deleteScript(){

  let name = prompt("삭제 이름");
  if(!name) return;

  if(!scripts[name]){
    alert("없음");
    return;
  }

  let pass = prompt("비밀번호 (없으면 그냥 엔터)");

  if(scripts[name].pass && scripts[name].pass != pass){
    alert("비번 틀림");
    return;
  }

  delete scripts[name];
  localStorage.setItem("scripts", JSON.stringify(scripts));

  alert("삭제됨");
}

</script>

</body>
</html>
