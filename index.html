<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>대본 연습</title>
<style>

.direction{
color:gold !important;
font-weight:bold;
}

.mine{
color:#00ff88 !important;
font-weight:bold;
}
  
body{
margin:0;
background:#1a1a1a;
color:white;
font-family:Arial;
}

.banner{
width:100%;
max-width:900px;
margin:0 auto 20px auto;
border-radius:10px;
overflow:hidden;
}

.banner img{
width:100%;
height:auto;
display:block;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.section{
background:#2a2a2a;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.scriptBox{
background:#f5f5f5;
color:black;
padding:20px;
border-radius:10px;
margin-bottom:15px;
}

textarea{
width:100%;
height:260px;
font-size:16px;
background:white;
color:black;
}

.display{
background:#111;
padding:20px;
border-radius:10px;
min-height:70px;
margin-bottom:10px;
font-size:20px;
}

.gauge{
height:14px;
background:#333;
margin-top:10px;
border-radius:6px;
overflow:hidden;
}

.gaugeBar{
height:100%;
width:100%;
background:gold;
}

.fullBtn{
width:100%;
background:#777;
color:white;
font-size:26px;
padding:18px;
border:none;
border-radius:8px;
cursor:pointer;
margin-bottom:10px;
}

.pauseBtn{
width:100%;
background:#c0392b;
color:white;
font-size:22px;
padding:15px;
border:none;
border-radius:8px;
cursor:pointer;
margin-bottom:10px;
display:none;
}

.resumeBtn{
width:100%;
background:#27ae60;
color:white;
font-size:22px;
padding:15px;
border:none;
border-radius:8px;
cursor:pointer;
margin-bottom:10px;
display:none;
}

.row{
display:flex;
gap:10px;
}

.yellowBtn{
background:gold;
color:black;
font-size:20px;
padding:15px;
border:none;
border-radius:8px;
cursor:pointer;
flex:1;
}

.autoOff{
background:red;
color:white;
font-size:20px;
padding:15px;
border:none;
border-radius:8px;
cursor:pointer;
flex:1;
}

.autoOn{
background:green;
color:white;
font-size:20px;
padding:15px;
border:none;
border-radius:8px;
cursor:pointer;
flex:1;
}

.small{
padding:6px 10px;
font-size:14px;
}

/* 모바일 최적화 */
@media (max-width:768px){

.container{
padding:10px;
}

textarea{
height:180px;
font-size:18px;
}

.display{
font-size:22px;
min-height:120px;
padding:25px;
}

.fullBtn{
font-size:22px;
padding:16px;
}

.yellowBtn, .autoOff, .autoOn{
font-size:18px;
padding:14px;
}

}

</style>
</head>

<body>

<div class="banner">
<img src="banner.png">
</div>

<div class="container">

<div class="section">
역할:
<input id="roleInput" placeholder="예: 종대">

<br><br>

음성:
<select id="voiceSelect">
<option value="male">남자</option>
<option value="female">여자</option>
</select>

속도:
<input type="range" min="0.5" max="2" step="0.1" value="1" id="speed">
<span id="speedVal">1</span>
</div>

<div class="scriptBox">
대본:
<textarea id="scriptInput">
종대: 니 지금 뭐하냐?!
문이 천천히 열린다
한별: 아무것도 안했는데요
잠시 정적이 흐른다
종대: 거짓말하지 마라
한별: 거짓말?! 나보다 어려 보이는 고만..확!
</textarea>
</div>

<div class="display" id="display">
&lt;상대 대사&gt;
</div>

<div class="gauge">
<div class="gaugeBar" id="gaugeBar"></div>
</div>

<button class="fullBtn" onclick="startPractice()">
연습 시작
</button>

<button id="pauseBtn" class="pauseBtn" onclick="pauseAuto()">
⏸ 일시정지
</button>

<button id="resumeBtn" class="resumeBtn" onclick="resumeAuto()">
▶ 다시하기
</button>

<button class="fullBtn" onclick="showMyLine()">
내 대사 보기
</button>

<div class="row">
<button class="yellowBtn" onclick="prevLine()">이전</button>
<button id="autoBtn" class="autoOff" onclick="toggleAuto()">자동연습 OFF</button>
<button class="yellowBtn" onclick="nextLine()">다음</button>
</div>

<br>
저장 이름:
<input id="saveName" placeholder="예: 오디션1">

비밀번호:
<input id="savePass" type="password" maxlength="4" placeholder="4자리">

<br><br>

<button class="small" onclick="saveScript()">💾 저장</button>
<button class="small" onclick="loadScript()">📂 불러오기</button>
<button class="small" onclick="deleteScript()">🗑 삭제</button>

<br><br>

<select id="saveList" style="width:100%; padding:8px;"></select>

<br><br>

연습횟수:
<span id="count">0</span>

</div>

<script>

let lines=[];
let index=0;
let role="";
let autoMode=false;
let paused=false;

let gaugeTimer=null;
let autoTimer=null;

let totalDuration=0;
let remainingTime=0;
let startTime=0;

const synth=window.speechSynthesis;

function parseScript(){

role=document.getElementById("roleInput").value.trim();

lines=document.getElementById("scriptInput").value
.split("\n")
.map(l=>{

l=l.trim();
if(!l) return null;

if(l.includes(":")){
let p=l.split(":");
return {
role:p[0].trim(),
text:p[1].trim(),
type:"dialogue"
};
}else{
return {
role:"direction",
text:l.replace("[지문]","").trim(),
type:"direction"
};
}

})
.filter(l=>l!==null);

}

function getVoice(){
let voices=synth.getVoices();
return voices.find(v=>v.lang.includes("ko")) || voices[0];
}

function speak(text,callback){

let utter=new SpeechSynthesisUtterance(text);

utter.voice=getVoice();
utter.lang="ko-KR";
utter.rate=parseFloat(document.getElementById("speed").value);
utter.onend=callback;

synth.cancel();
synth.speak(utter);

}

function showLine(){

let line=lines[index];
let display=document.getElementById("display");

if(line.type==="direction"){

display.innerText="[지문] "+line.text;
display.className="display direction";

speak(line.text,()=>{
if(autoMode && !paused) autoNext();
});

return;
}

if(line.role===role){

display.innerText="<내 차례>";
display.className="display mine";

if(autoMode && !paused) autoNext();

}else{

display.innerText=line.text;
display.className="display";

speak(line.text,()=>{
if(autoMode && !paused) autoNext();
});

}

}

function showMyLine(){

for(let i=index;i<lines.length;i++){
if(lines[i].role===role){
let d=document.getElementById("display");
d.innerText=lines[i].text;
d.className="display mine";
return;
}
}

for(let i=0;i<index;i++){
if(lines[i].role===role){
let d=document.getElementById("display");
d.innerText=lines[i].text;
d.className="display mine";
return;
}
}

}

function nextLine(){
parseScript();
index=(index+1)%lines.length;
showLine();
}

function prevLine(){
parseScript();
index--;
if(index<0) index=lines.length-1;
showLine();
}

function startPractice(){
parseScript();
index=0;
showLine();
}

function updateSaveList(){

let list=document.getElementById("saveList");
list.innerHTML="";

for(let i=0;i<localStorage.length;i++){

let key=localStorage.key(i);

if(key.startsWith("script_")){

let name=key.replace("script_","");
let option=document.createElement("option");

option.value=name;
option.text=name;

list.appendChild(option);

}

}

}

function saveScript(){

let name=document.getElementById("saveName").value.trim();
let pass=document.getElementById("savePass").value.trim();

if(pass.length!==4){
alert("비밀번호 4자리");
return;
}

let data={
script:document.getElementById("scriptInput").value,
role:document.getElementById("roleInput").value,
pass:pass
};

localStorage.setItem("script_"+name,JSON.stringify(data));
updateSaveList();
alert("저장됨");

}

function loadScript(){

let name=document.getElementById("saveList").value;
let inputPass=prompt("비밀번호 입력");

let data=JSON.parse(localStorage.getItem("script_"+name));

if(data.pass && inputPass!==data.pass){
alert("비밀번호 틀림");
return;
}

document.getElementById("scriptInput").value=data.script;
document.getElementById("roleInput").value=data.role;

alert("불러옴");

}

function deleteScript(){

let name=document.getElementById("saveList").value;
let inputPass=prompt("비밀번호 입력");

let data=JSON.parse(localStorage.getItem("script_"+name));

if(data.pass && inputPass!==data.pass){
alert("비밀번호 틀림");
return;
}

localStorage.removeItem("script_"+name);
updateSaveList();
alert("삭제됨");

}

window.onload=function(){
updateSaveList();
}

</script>

</body>
</html>
