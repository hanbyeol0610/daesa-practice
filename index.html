<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>대본 연습</title>
<style>
  
.mine{
color:#00ff88;
font-weight:bold;
}
  
.direction{
color:gold;
font-weight:bold;
}
  
body{
margin:0;
background:#1a1a1a;
color:white;
font-family:Arial;
}

.banner{
width:100%;
max-width:900px;
margin:0 auto 20px auto;
border-radius:10px;
overflow:hidden;
}

.banner img{
width:100%;
height:auto;
display:block;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.section{
background:#2a2a2a;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.scriptBox{
background:#f5f5f5;
color:black;
padding:20px;
border-radius:10px;
margin-bottom:15px;
}

textarea{
width:100%;
height:260px;
font-size:16px;
background:white;
color:black;
}

.display{
background:#111;
padding:20px;
border-radius:10px;
min-height:70px;
margin-bottom:10px;
font-size:20px;
}

.gauge{
height:14px;
background:#333;
margin-top:10px;
border-radius:6px;
overflow:hidden;
}

.gaugeBar{
height:100%;
width:100%;
background:gold;
}

.fullBtn{
width:100%;
background:#777;
color:white;
font-size:26px;
padding:18px;
border:none;
border-radius:8px;
cursor:pointer;
margin-bottom:10px;
}

.pauseBtn{
width:100%;
background:#c0392b;
color:white;
font-size:22px;
padding:15px;
border:none;
border-radius:8px;
cursor:pointer;
margin-bottom:10px;
display:none;
}

.resumeBtn{
width:100%;
background:#27ae60;
color:white;
font-size:22px;
padding:15px;
border:none;
border-radius:8px;
cursor:pointer;
margin-bottom:10px;
display:none;
}

.row{
display:flex;
gap:10px;
}

.yellowBtn{
background:gold;
color:black;
font-size:20px;
padding:15px;
border:none;
border-radius:8px;
cursor:pointer;
flex:1;
}

.autoOff{
background:red;
color:white;
font-size:20px;
padding:15px;
border:none;
border-radius:8px;
cursor:pointer;
flex:1;
}

.autoOn{
background:green;
color:white;
font-size:20px;
padding:15px;
border:none;
border-radius:8px;
cursor:pointer;
flex:1;
}

.small{
padding:6px 10px;
font-size:14px;
}
</style>
</head>

<body>

<div class="banner">
<img src="banner.png">
</div>

<div class="container">

<div class="section">
역할:
<input id="roleInput" placeholder="예: 종대">

<br><br>

음성:
<select id="voiceSelect">
<option value="male">남자</option>
<option value="female">여자</option>
</select>

속도:
<input type="range" min="0" max="10" step="1" value="5" id="speed">
<span id="speedVal">5</span>
</div>

<div class="scriptBox">
대본:
<textarea id="scriptInput">
종대: 니 지금 뭐하냐?!
문이 천천히 열린다
한별: 아무것도 안했는데요
잠시 정적이 흐른다
종대: 거짓말하지 마라
한별: 거짓말?! 나보다 어려 보이는 고만..확!
</textarea>
</div>

<div class="display" id="display">
&lt;상대 대사&gt;
</div>

<div class="gauge">
<div class="gaugeBar" id="gaugeBar"></div>
</div>

<button class="fullBtn" onclick="startPractice()">
연습 시작
</button>

<button id="pauseBtn" class="pauseBtn" onclick="pauseAuto()">
⏸ 일시정지
</button>

<button id="resumeBtn" class="resumeBtn" onclick="resumeAuto()">
▶ 다시하기
</button>

<button class="fullBtn" onclick="showMyLine()">
내 대사 보기
</button>

<div class="row">
<button class="yellowBtn" onclick="prevLine()">이전</button>
<button id="autoBtn" class="autoOff" onclick="toggleAuto()">자동연습 OFF</button>
<button class="yellowBtn" onclick="nextLine()">다음</button>
</div>

<br>
저장 이름:
<input id="saveName" placeholder="예: 오디션1">

비밀번호:
<input id="savePass" type="password" maxlength="4" placeholder="4자리">

<br><br>

<button class="small" onclick="saveScript()">💾 저장</button>
<button class="small" onclick="loadScript()">📂 불러오기</button>
<button class="small" onclick="deleteScript()">🗑 삭제</button>

<br><br>

<select id="saveList" style="width:100%; padding:8px;"></select>

<br><br>

연습횟수:
<span id="count">0</span>

</div>

<script>

let lines=[];
let index=0;
let role="";
let autoMode=false;
let paused=false;
let myLineVisible=false;

let gaugeTimer=null;
let autoTimer=null;

let totalDuration=0;
let remainingTime=0;
let startTime=0;

const synth=window.speechSynthesis;

document.getElementById("speed").oninput=function(){
document.getElementById("speedVal").innerText=this.value;
}

function parseScript(){

role=document.getElementById("roleInput").value.trim();

lines=document.getElementById("scriptInput").value
.split("\n")
.map(l=>{

l=l.trim();

if(!l) return null;

if(l.includes(":")){
let p=l.split(":");
return {
role:p[0].trim(),
text:p[1].trim(),
type:"dialogue"
};
}else{
return {
role:"direction",
text:l,
type:"direction"
};
}

})
.filter(l=>l!==null);

}

function getVoice(){

let voices=synth.getVoices();

return voices.find(v=>v.lang.includes("ko")) || voices[0];

}

function speak(text,callback){

let utter=new SpeechSynthesisUtterance(text);

let speedValue=parseInt(document.getElementById("speed").value);
let rate = 0.5 + (speedValue/10)*1.5;

utter.voice=getVoice();
utter.lang="ko-KR";
utter.rate=rate;
utter.pitch=document.getElementById("voiceSelect").value==="male"?0.7:1.3;

utter.onend=callback;

synth.cancel();
synth.speak(utter);

}

function showLine(){

myLineVisible=false;

if(index<0)index=0;
if(index>=lines.length)index=0;

let line=lines[index];
let display=document.getElementById("display");

// 지문이면
if(line.type==="direction"){

display.innerText="[지문] "+line.text;
display.className="display direction";

speak(line.text,()=>{
if(autoMode && !paused) autoNext();
});

return;
}

// 내 대사
if(line.role===role){
display.innerText="<내 차례>";
display.className="display";
if(autoMode && !paused) autoNext();
}else{
display.innerText=line.text;
display.className="display";

speak(line.text,()=>{
if(autoMode && !paused) autoNext();
});
}

}

function showMyLine(){

parseScript();

let display=document.getElementById("display");

// 토글 OFF
if(myLineVisible){
display.innerText="<내 차례>";
display.className="display";
myLineVisible=false;
return;
}

// 찾기
for(let i=index;i<lines.length;i++){
if(lines[i].role===role){
display.innerText=lines[i].text;
display.className="display mine";
myLineVisible=true;
return;
}
}

for(let i=0;i<index;i++){
if(lines[i].role===role){
display.innerText=lines[i].text;
display.className="display mine";
myLineVisible=true;
return;
}
}

}

function nextLine(){

parseScript();

do{
index++;
if(index>=lines.length) index=0;
}while(lines[index].role===role);

showLine();
}

function prevLine(){

parseScript();

do{
index--;
if(index<0) index=lines.length-1;
}while(lines[index].role===role);

showLine();
}

function startPractice(){
parseScript();
index=0;
showLine();
}

function toggleAuto(){

autoMode=!autoMode;
let btn=document.getElementById("autoBtn");

if(autoMode){
btn.className="autoOn";
btn.innerText="자동연습 ON";
document.getElementById("pauseBtn").style.display="block";
startPractice();
}else{
stopAuto();
}

}

function pauseAuto(){

paused=true;

clearTimeout(autoTimer);
clearInterval(gaugeTimer);

remainingTime = totalDuration - (Date.now()-startTime);

document.getElementById("pauseBtn").style.display="none";
document.getElementById("resumeBtn").style.display="block";

}

function resumeAuto(){

paused=false;

startTime = Date.now() - (totalDuration - remainingTime);

startGauge(totalDuration);

autoTimer=setTimeout(()=>{
autoNext();
},remainingTime);

document.getElementById("pauseBtn").style.display="block";
document.getElementById("resumeBtn").style.display="none";

}

function stopAuto(){

autoMode=false;
paused=false;

document.getElementById("autoBtn").className="autoOff";
document.getElementById("autoBtn").innerText="자동연습 OFF";

document.getElementById("pauseBtn").style.display="none";
document.getElementById("resumeBtn").style.display="none";

clearTimeout(autoTimer);
clearInterval(gaugeTimer);

document.getElementById("display").innerText="<상대 대사>";
document.getElementById("gaugeBar").style.width="100%";

}

function autoNext(){

if(!autoMode || paused) return;

index++;

if(index>=lines.length){
stopAuto();
return;
}

let line=lines[index];

if(line.role===role){

let duration=(line.text.length*80)+4000;

totalDuration=duration;
remainingTime=duration;
startTime=Date.now();

startGauge(duration);

autoTimer=setTimeout(()=>{
autoNext();
},duration);

}else{
showLine();
}

}

function startGauge(duration){

let bar=document.getElementById("gaugeBar");

clearInterval(gaugeTimer);

gaugeTimer=setInterval(()=>{

let elapsed=Date.now()-startTime;
let percent=100-(elapsed/duration)*100;

if(percent<0) percent=0;
if(percent>100) percent=100;

bar.style.width=percent+"%";

if(percent<=0){
clearInterval(gaugeTimer);
}

},50);

}

function updateSaveList(){

let list=document.getElementById("saveList");
list.innerHTML="";

for(let i=0;i<localStorage.length;i++){

let key=localStorage.key(i);

if(key.startsWith("script_")){

let name=key.replace("script_","");

let option=document.createElement("option");
option.value=name;
option.text=name;

list.appendChild(option);

}

}

}

function saveScript(){

let name=document.getElementById("saveName").value.trim();
let pass=document.getElementById("savePass").value.trim();

if(name===""){
alert("이름 입력");
return;
}

if(pass.length!==4){
alert("비밀번호 4자리");
return;
}

let data={
script:document.getElementById("scriptInput").value,
role:document.getElementById("roleInput").value,
pass:pass
};

localStorage.setItem("script_"+name,JSON.stringify(data));

updateSaveList();

alert("저장됨");

}

function loadScript(){

let name=document.getElementById("saveList").value;

if(!name) return;

let inputPass=prompt("비밀번호 입력");

let data=JSON.parse(localStorage.getItem("script_"+name));

if(inputPass!==data.pass){
alert("비밀번호 틀림");
return;
}

document.getElementById("scriptInput").value=data.script;
document.getElementById("roleInput").value=data.role;

alert("불러옴");

}

function deleteScript(){

let name=document.getElementById("saveList").value;

if(!name) return;

let inputPass=prompt("비밀번호 입력");

let data=JSON.parse(localStorage.getItem("script_"+name));

if(inputPass!==data.pass){
alert("비밀번호 틀림");
return;
}

localStorage.removeItem("script_"+name);

updateSaveList();

alert("삭제됨");

}

window.onload=function(){
updateSaveList();
}
</script>

</body>
</html>
