<script>

let lines=[];
let index=0;
let role="";
let autoMode=false;
let paused=false;

let gaugeTimer=null;
let autoTimer=null;

let totalDuration=0;
let remainingTime=0;
let startTime=0;

const synth=window.speechSynthesis;

function parseScript(){
role=document.getElementById("roleInput").value.trim();
lines=document.getElementById("scriptInput").value
.split("\n")
.map(l=>{
let p=l.split(":");
return { role:p[0]?.trim(), text:p[1]?.trim() };
});
}

function getVoice(){
let voices=synth.getVoices();
return voices.find(v=>v.lang.includes("ko")) || voices[0];
}

function speak(text,callback){

let utter=new SpeechSynthesisUtterance(text);
let gender=document.getElementById("voiceSelect").value;

utter.voice=getVoice();
utter.lang="ko-KR";
utter.rate=parseFloat(document.getElementById("speed").value)/2.5;
utter.pitch = gender==="male"?0.6:1.3;
utter.onend=callback;

synth.cancel();
synth.speak(utter);
}

function showLine(){

if(index<0)index=0;
if(index>=lines.length)index=0;

let line=lines[index];

if(line.role===role){
document.getElementById("display").innerText="<내 차례>";
if(autoMode && !paused) autoNext();
}else{
document.getElementById("display").innerText=line.text;
speak(line.text,()=>{
if(autoMode && !paused) autoNext();
});
}

}

function nextLine(){

parseScript();

do{
index++;
if(index>=lines.length) index=0;
}while(lines[index].role===role);

showLine();
}

function prevLine(){

parseScript();

do{
index--;
if(index<0) index=lines.length-1;
}while(lines[index].role===role);

showLine();
}

function startPractice(){
parseScript();
index=0;
showLine();
}

function toggleAuto(){

autoMode=!autoMode;
let btn=document.getElementById("autoBtn");

if(autoMode){
btn.className="autoOn";
btn.innerText="자동연습 ON";
document.getElementById("pauseBtn").style.display="block";
startPractice();
}else{
stopAuto();
}

}

function pauseAuto(){

paused=true;

clearTimeout(autoTimer);
clearInterval(gaugeTimer);

// 남은 시간 계산
remainingTime = totalDuration - (Date.now()-startTime);
if(remainingTime < 0) remainingTime = 0;

document.getElementById("pauseBtn").style.display="none";
document.getElementById("resumeBtn").style.display="block";

}

function resumeAuto(){

paused=false;

// 시작시간 다시 설정
startTime = Date.now();
totalDuration = remainingTime;

// 게이지 이어서 시작
startGauge(remainingTime);

// 자동 타이머 이어서 시작
autoTimer=setTimeout(()=>{
autoNext();
},remainingTime);

document.getElementById("pauseBtn").style.display="block";
document.getElementById("resumeBtn").style.display="none";

}

function stopAuto(){

autoMode=false;
paused=false;

document.getElementById("autoBtn").className="autoOff";
document.getElementById("autoBtn").innerText="자동연습 OFF";

document.getElementById("pauseBtn").style.display="none";
document.getElementById("resumeBtn").style.display="none";

clearTimeout(autoTimer);
clearInterval(gaugeTimer);

document.getElementById("display").innerText="<상대 대사>";
document.getElementById("gaugeBar").style.width="100%";

}

function autoNext(){

if(!autoMode || paused) return;

index++;

if(index>=lines.length){
stopAuto();
return;
}

let line=lines[index];

if(line.role===role){

let duration=(line.text.length*80)+6000;

totalDuration=duration;
remainingTime=duration;
startTime=Date.now();

startGauge(duration);

autoTimer=setTimeout(()=>{
autoNext();
},duration);

}else{
showLine();
}

}

function startGauge(duration){

let bar=document.getElementById("gaugeBar");

clearInterval(gaugeTimer);

gaugeTimer=setInterval(()=>{

if(paused) return;

let elapsed=Date.now()-startTime;
let percent=100-(elapsed/totalDuration)*100;

if(percent<0) percent=0;

bar.style.width=percent+"%";

if(percent<=0){
clearInterval(gaugeTimer);
}

},50);

}

function saveScript(){
localStorage.setItem("script",document.getElementById("scriptInput").value);
localStorage.setItem("role",document.getElementById("roleInput").value);
alert("저장됨");
}

function loadScript(){
document.getElementById("scriptInput").value=localStorage.getItem("script")||"";
document.getElementById("roleInput").value=localStorage.getItem("role")||"";
alert("불러옴");
}

document.getElementById("speed").oninput=function(){
document.getElementById("speedVal").innerText=this.value;
}

</script>
