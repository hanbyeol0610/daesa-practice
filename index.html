<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>대본 연습</title>
<style>

.direction{
color:gold;
font-weight:bold;
}

.myLine{
color:#00ff88;
font-weight:bold;
}
  
body{
margin:0;
background:#1a1a1a;
color:white;
font-family:Arial;
}

.banner{
width:100%;
max-width:900px;
margin:0 auto 20px auto;
border-radius:10px;
overflow:hidden;
}

.banner img{
width:100%;
height:auto;
display:block;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.section{
background:#2a2a2a;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.scriptBox{
background:#f5f5f5;
color:black;
padding:20px;
border-radius:10px;
margin-bottom:15px;
}

textarea{
width:100%;
height:260px;
font-size:16px;
background:white;
color:black;
}

.display{
background:#111;
padding:20px;
border-radius:10px;
min-height:70px;
margin-bottom:10px;
font-size:20px;
}

.gauge{
height:14px;
background:#333;
margin-top:10px;
border-radius:6px;
overflow:hidden;
}

.gaugeBar{
height:100%;
width:100%;
background:gold;
}

.fullBtn{
width:100%;
background:#777;
color:white;
font-size:26px;
padding:18px;
border:none;
border-radius:8px;
cursor:pointer;
margin-bottom:10px;
}

.pauseBtn{
width:100%;
background:#c0392b;
color:white;
font-size:22px;
padding:15px;
border:none;
border-radius:8px;
cursor:pointer;
margin-bottom:10px;
display:none;
}

.resumeBtn{
width:100%;
background:#27ae60;
color:white;
font-size:22px;
padding:15px;
border:none;
border-radius:8px;
cursor:pointer;
margin-bottom:10px;
display:none;
}

.row{
display:flex;
gap:10px;
}

.yellowBtn{
background:gold;
color:black;
font-size:20px;
padding:15px;
border:none;
border-radius:8px;
cursor:pointer;
flex:1;
}

.autoOff{
background:red;
color:white;
font-size:20px;
padding:15px;
border:none;
border-radius:8px;
cursor:pointer;
flex:1;
}

.autoOn{
background:green;
color:white;
font-size:20px;
padding:15px;
border:none;
border-radius:8px;
cursor:pointer;
flex:1;
}

.small{
padding:6px 10px;
font-size:14px;
}
</style>
</head>

<body>

<div class="banner">
<img src="banner.png">
</div>

<div class="container">

<div class="section">
역할:
<input id="roleInput" placeholder="예: 종대">

<br><br>

음성:
<select id="voiceSelect">
<option value="male">남자</option>
<option value="female">여자</option>
</select>

속도:
<input type="range" min="0.5" max="2" step="0.1" value="1" id="speed">
<span id="speedVal">1</span>
</div>

<div class="scriptBox">
대본:
<textarea id="scriptInput"></textarea>
</div>

<div id="display" class="display">
&lt;상대 대사&gt;
</div>

<div class="gauge">
<div id="gaugeBar" class="gaugeBar"></div>
</div>

<button class="fullBtn" onclick="startPractice()">연습 시작</button>

<button id="pauseBtn" class="pauseBtn" onclick="pauseAuto()">⏸ 일시정지</button>
<button id="resumeBtn" class="resumeBtn" onclick="resumeAuto()">▶ 다시하기</button>

<button class="fullBtn" onclick="showMyLine()">내 대사 보기</button>

<div class="row">
<button class="yellowBtn" onclick="prevLine()">이전</button>
<button id="autoBtn" class="autoOff" onclick="toggleAuto()">자동연습 OFF</button>
<button class="yellowBtn" onclick="nextLine()">다음</button>
</div>

<br>

연습횟수:
<span id="count">0</span>

</div>

<script>

let lines=[];
let index=0;
let role="";
let autoMode=false;
let paused=false;

let gaugeTimer=null;
let autoTimer=null;

let totalDuration=0;
let remainingTime=0;
let startTime=0;

const synth=window.speechSynthesis;

function parseScript(){

role=document.getElementById("roleInput").value.trim();

lines=document.getElementById("scriptInput").value
.split("\n")
.map(l=>{

l=l.trim();
if(!l) return null;

if(l.includes(":")){
let p=l.split(":");
return {role:p[0].trim(),text:p[1].trim(),type:"dialogue"};
}else{
return {role:"direction",text:l,type:"direction"};
}

})
.filter(l=>l!==null);

}

function speak(text,callback){

let utter=new SpeechSynthesisUtterance(text);

utter.lang="ko-KR";
utter.rate=parseFloat(document.getElementById("speed").value);

utter.onend=callback;

synth.cancel();
synth.speak(utter);

}

function showLine(){

let line=lines[index];
let display=document.getElementById("display");

if(line.type==="direction"){
display.innerText="[지문] "+line.text;
display.className="display direction";

speak(line.text,()=>{
if(autoMode && !paused) autoNext();
});

return;
}

if(line.role===role){
display.innerText="<내 차례>";
display.className="display";
if(autoMode && !paused) autoNext();
}else{

display.innerText=line.text;
display.className="display";

speak(line.text,()=>{
if(autoMode && !paused) autoNext();
});
}

}

function showMyLine(){

for(let i=index;i<lines.length;i++){
if(lines[i].role===role){

let display=document.getElementById("display");

display.innerText=lines[i].text;
display.className="display myLine";

return;
}
}

}

function nextLine(){

do{
index++;
if(index>=lines.length) index=0;
}while(lines[index].role===role);

showLine();
}

function prevLine(){

do{
index--;
if(index<0) index=lines.length-1;
}while(lines[index].role===role);

showLine();
}

function startPractice(){
parseScript();
index=0;
showLine();
}

function toggleAuto(){

autoMode=!autoMode;
let btn=document.getElementById("autoBtn");

if(autoMode){
btn.className="autoOn";
btn.innerText="자동연습 ON";
document.getElementById("pauseBtn").style.display="block";
startPractice();
}else{
stopAuto();
}

}

function pauseAuto(){

paused=true;

clearTimeout(autoTimer);
clearInterval(gaugeTimer);

remainingTime = totalDuration - (Date.now()-startTime);

document.getElementById("pauseBtn").style.display="none";
document.getElementById("resumeBtn").style.display="block";

}

function resumeAuto(){

paused=false;

startTime = Date.now() - (totalDuration - remainingTime);

startGauge(totalDuration);

autoTimer=setTimeout(()=>{
autoNext();
},remainingTime);

document.getElementById("pauseBtn").style.display="block";
document.getElementById("resumeBtn").style.display="none";

}

function stopAuto(){

autoMode=false;
paused=false;

document.getElementById("autoBtn").className="autoOff";
document.getElementById("autoBtn").innerText="자동연습 OFF";

document.getElementById("pauseBtn").style.display="none";
document.getElementById("resumeBtn").style.display="none";

clearTimeout(autoTimer);
clearInterval(gaugeTimer);

document.getElementById("gaugeBar").style.width="100%";

}

function autoNext(){

if(!autoMode || paused) return;

index++;

if(index>=lines.length){
stopAuto();
return;
}

let line=lines[index];

if(line.role===role){

let duration=(line.text.length*80)+2000;

totalDuration=duration;
remainingTime=duration;
startTime=Date.now();

startGauge(duration);

autoTimer=setTimeout(()=>{
autoNext();
},duration);

}else{
showLine();
}

}

function startGauge(duration){

let bar=document.getElementById("gaugeBar");

clearInterval(gaugeTimer);

gaugeTimer=setInterval(()=>{

let elapsed=Date.now()-startTime;
let percent=100-(elapsed/duration)*100;

if(percent<0) percent=0;

bar.style.width=percent+"%";

if(percent<=0){
clearInterval(gaugeTimer);
}

},50);

}

</script>

</body>
</html>
